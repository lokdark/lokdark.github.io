# ---------------------------------------------------------------------------
# Luke's blog — site configuration (Hugo)
# Theme: hello-friend-ng (MIT) https://github.com/rhazdon/hugo-theme-hello-friend-ng
# ---------------------------------------------------------------------------

# Change this if the site is published somewhere else (custom domain, user page, ...).
baseURL = "https://lokdark.github.io/"

title        = "Luke"
locale       = "en-us"

# Language of the content in ./content. Add [languages.xx] blocks below to go
# multilingual (the theme ships a global language menu).
defaultContentLanguage = "en"

theme = "hello-friend-ng"

PygmentsCodeFences = true
PygmentsStyle      = "monokai"

copyright = "© 2026 Luke" # Only used by the RSS template.

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
staticDir    = "static"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = false

enableRobotsTXT     = true
enableGitInfo       = false
enableEmoji         = true
enableMissingTranslationPlaceholders = false
disableRSS          = false
disableSitemap      = false
disable404          = false
disableHugoGeneratorInject = false

[pagination]
  disableAliases = false
  pagerSize      = 20
  path           = 'page'

[services]
  [services.rss]
      # Maximum number of items in the RSS feed.
      limit = 42

#   [services.disqus]
#     shortname = 'your-disqus-shortname'
#   [services.googleAnalytics]
#     ID = 'G-MEASUREMENT_ID'

[permalinks]
  posts = "/posts/:year/:month/:title/"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Metadata mostly used in document's head
  description = "Luke's personal blog"
  keywords    = ""
  images      = [""]

  # Colour of the browser UI (mobile address bar / tab strip).
  themeColor  = "#1b1c1d"

  # Big heading on the home page (falls back to `title` when empty).
  homeTitle = "Hi Stranger"

  # Home subtitle of the index page (typed character by character - see
  # layouts/partials/subtitle.html).
  homeSubtitle = "Welcome to my blog."

  # How many recent posts to list in the home page's "Latest posts" block.
  homePostsCount = 3

  # Set a background for the homepage
  # backgroundImage = "assets/images/background.jpg"

  # Prefix of link to the git commit detail page. GitInfo must be enabled.
  # gitUrl = ""

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Theme toggle (light/dark switcher in the header). Disabled: the site is locked to the dark palette.
  enableThemeToggle = false

  # Sharing buttons
  enableSharingButtons = true

  # Reading time on post info
  enableReadingTime = true

  # Global language menu (the "en" switcher in the header). Only useful when the
  # site has more than one [languages.xx] block.
  enableGlobalLanguageMenu = false

  # Add extra javascript / stylesheets here, e.g. "css/styles.css" or an http url.
  customCSS = ["/css/Luke.css"]
  customJS  = []

  # Integrate Plausible.io
  # plausibleDataDomain = 'test.com'
  # plausibleScriptSource = 'https://plausible.io/js/script.js'

  [params.author]
    name = "Luke"

  [params.footer]
    # Footer contents: © 2026 · Luke · RSS (set a flag to false to hide it).
    trademark = 2026
    rss       = true
    author    = true
    copyright = false

    topText    = []
    bottomText = []

  # Colours used by the favicon <head> tags (see layouts/partials/favicons.html).
  [params.favicon]
    mask          = "#fe5186"
    msapplication = "#1b1c1d"
  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/Luke"
    logoHomeLink = "/"

  # Avatar shown above the home page title (file: static/img/avatar.jpg, square).
  # Remove the block to hide it, or point `path` at another image.
  [params.portrait]
    path     = "/img/avatar.jpg"
    alt      = "Luke"
    maxWidth = "120px"

  # Addon: Utteranc.es comments (GitHub issues backed)
  # [params.utterances]
  #   repository = "dizzy-77/dizzy-77.github.io"
  #   label      = "comments"
  #   issueTerm  = "pathname"
  #   theme      = "preferred-color-scheme"

  # Social icons under the home page title. `name` must be one of the icons
  # listed in themes/hello-friend-ng/docs/svgs.md (github, email, X, bluesky,
  # linkedin, telegram, stackoverflow, ...).
  [[params.social]]
    name = "github"
    url  = "https://github.com/dizzy-77"

  # [[params.social]]
  #   name = "email"
  #   url  = "mailto:you@example.com"

  # [[params.social]]
  #   name = "X"
  #   url  = "https://x.com/your-handle"

  # [[params.social]]
  #   name = "linkedin"
  #   url  = "https://www.linkedin.com/in/your-handle/"

  [[params.social]]
    name = "rss"
    url  = "index.xml"

[languages]
  [languages.en]
    weight    = 1
  [languages.en.params]
    subtitle = "Luke's Blog"

[menu]
  [[menu.main]]
    identifier  = "about"
    name        = "About"
    url         = "about/"

  [[menu.main]]
    identifier = "categories"
    name       = "Categories"
    url        = "categories/"

  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "posts/"
